[pytest]
testpaths = .
addopts = -ra
asyncio_default_fixture_loop_scope = function
markers =
    tier1: Tier 1 feature coverage checks (offline, hermetic)
    tier2: Tier 2 boundary and corner-case checks (offline, hermetic)
    tier3: Tier 3 cross-feature pairwise integration checks (offline, hermetic)
    tier4: Tier 4 live real-world acceptance checks
    live_backlog: Requires M4 repo deliverables and read-only live Jev/Linear/Notion checks
filterwarnings =
    ignore::DeprecationWarning:langsmith.*
    ignore::pytest.PytestDeprecationWarning:pytest_asyncio.*
