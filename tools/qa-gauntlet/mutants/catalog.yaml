# Saboteur mutant catalog — oracle-sensitivity calibration.
# Rules: never target locked-eval files; every entry records a one-time GitNexus
# impact() result; patches are committed but only ever applied in throwaway worktrees.
# role: control | expected-miss | defect (required). Kill-rate and exit contracts
# are driven by role — see saboteur.py summarize / exit_code_for.
#
# Calibration routing:
#   default (no flags): every mutant auto-routes by expectedOracles
#     swarm_unit → saboteur --swarm-filter path; others → ladder + ReplayGolden
#   --swarm-filter (no --mutants): swarm_unit family only (10/11/12/14/15/17)
#   --mutants <ids>: explicit subset; path still auto-routes unless --swarm-filter
