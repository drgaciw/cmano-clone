# GitNexus pipeline (STAGED — not yet activated)
# See docs/engineering/buildkite-ci.md
#
# This file stages the two GitNexus steps currently run inline in
# `.buildkite/pipeline.yml` (PR impact analysis + reindex) as a standalone
# pipeline, so they can eventually be moved off the main blocking pipeline's
# wall clock via an async `trigger:` step. Both GitNexus steps are, and
# remain, soft-fail / advisory only.
#
# ACTIVATION (human action required, not done by this commit):
#   1. Create a new Buildkite pipeline in the UI (org `drgaciw`) with slug
#      `cmano-clone-gitnexus`, "Steps" source set to this file
#      (`.buildkite/gitnexus.yml`) in this repository.
#   2. Smoke-test it directly (manual build) before flipping the switch.
#   3. Uncomment the `gitnexus-trigger` step in `.buildkite/pipeline.yml`
#      and remove the two inline `gitnexus-pr` / `gitnexus-reindex` steps
#      from `.buildkite/pipeline.yml` in the same change.
#
# Until that happens, this file is inert — nothing in the main pipeline
# references it yet, and the inline GitNexus steps in pipeline.yml keep
# running exactly as they do today.

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

steps:
  - label: ":gitnexus: PR impact analysis"
    key: gitnexus-pr
    if: build.pull_request.id != null
    soft_fail: true
    command: bash tools/buildkite/agent-gitnexus-pr-analysis.sh
    agents:
      queue: linux-medium

  - label: ":gitnexus: Reindex knowledge graph (main)"
    key: gitnexus-reindex
    branches: main
    soft_fail: true
    command: bash tools/buildkite/agent-gitnexus-reindex.sh
    agents:
      queue: linux-medium
