name: Unity CI (manual)

# Full Unity Editor test runner — requires a Unity license secret.
# Headless Play Mode smoke already runs in Buildkite (.buildkite/pipeline.yml) without a license.

on:
  workflow_dispatch:
    inputs:
      test_platform:
        description: Test platform
        required: true
        default: editmode
        type: choice
        options:
          - editmode
          - playmode

concurrency:
  group: unity-ci-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  unity_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check Unity license prerequisites
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          fail() {
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::$1 See docs/engineering/gameci-license.md"
            exit 1
          }
          [ -n "$UNITY_LICENSE" ] || fail "UNITY_LICENSE secret is not set. Export a Personal .ulf and paste its full XML into the secret."
          [ -n "$UNITY_EMAIL" ] || fail "UNITY_EMAIL secret is not set."
          [ -n "$UNITY_PASSWORD" ] || fail "UNITY_PASSWORD secret is not set."
          if ! python3 - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.fromstring(os.environ["UNITY_LICENSE"])
          except ET.ParseError:
              print("::error::UNITY_LICENSE is not well-formed XML. Re-paste the complete .ulf file; do not paste an .alf request or base64 text.")
              sys.exit(1)
          if root.tag != "root" or root.find("License") is None:
              print("::error::UNITY_LICENSE is not a legacy Unity .ulf (expected root/License). UnityEntitlementLicense.xml cannot be used for this workflow.")
              sys.exit(1)
          if not any(element.tag.rsplit("}", 1)[-1] == "Signature" for element in root):
              print("::error::UNITY_LICENSE has no Signature element. Supply the complete signed .ulf, not an .alf request.")
              sys.exit(1)
          PY
          then
            fail "Unity license prerequisite check failed."
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Copy Unity plugin assemblies
        if: steps.license.outputs.configured == 'true'
        shell: pwsh
        run: |
          ./tools/copy-delegation-assemblies.ps1
          ./tools/Test-UnityPluginAssemblies.ps1

      - name: Unity test runner
        if: steps.license.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/ProjectAegis
          unityVersion: 6000.3.27f2  # keep in sync with unity/ProjectAegis/ProjectSettings/ProjectVersion.txt
          testMode: ${{ inputs.test_platform }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
