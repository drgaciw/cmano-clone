name: Unity CI (manual)

# Full Unity Editor test runner — requires a Unity license secret.
# Headless Play Mode smoke already runs in Buildkite (.buildkite/pipeline.yml) without a license.

on:
  workflow_dispatch:
    inputs:
      test_platform:
        description: Test platform
        required: true
        default: editmode
        type: choice
        options:
          - editmode
          - playmode

concurrency:
  group: unity-ci-${{ github.repository }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  unity_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Require valid Unity license
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          fail() {
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::$1 See docs/engineering/gameci-license.md"
            exit 1
          }
          [ -n "$UNITY_LICENSE" ] || fail "UNITY_LICENSE secret is not set. Export a Personal .ulf and paste its full XML into the secret."
          [ -n "$UNITY_EMAIL" ] || fail "UNITY_EMAIL secret is not set."
          [ -n "$UNITY_PASSWORD" ] || fail "UNITY_PASSWORD secret is not set."
          if ! printf '%s' "$UNITY_LICENSE" | grep -q '<Signature'; then
            fail "UNITY_LICENSE has no <Signature> element (Unity: 'Signature element not found in XML document'). It is truncated or is an .alf request, not a signed .ulf. Re-export the .ulf and paste the whole file."
          fi
          if ! printf '%s' "$UNITY_LICENSE" | grep -q '</root>'; then
            fail "UNITY_LICENSE does not end with </root>; the secret looks truncated. Re-paste the whole .ulf."
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Copy Unity plugin assemblies
        if: steps.license.outputs.configured == 'true'
        shell: pwsh
        run: |
          ./tools/copy-delegation-assemblies.ps1
          ./tools/Test-UnityPluginAssemblies.ps1

      - name: Unity test runner
        if: steps.license.outputs.configured == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/ProjectAegis
          unityVersion: 6000.3.22f1  # keep in sync with unity/ProjectAegis/ProjectSettings/ProjectVersion.txt
          testMode: ${{ inputs.test_platform }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}