# DISABLED (2026-06-20): GitHub Actions billing blocked; primary CI is Buildkite
# (`buildkite/cmano-clone`). Gitleaks runs on Buildkite (`agent-gitleaks.sh`).
# Re-enable when billing is restored — see production/qa/sprint-19-ci-local-gate-2026-06-08.md.
name: GitNexus Security Checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  codeql-csharp:
    if: false
    name: CodeQL (C#)
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build solution (CodeQL trace)
        run: dotnet build ProjectAegis.sln -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  codeql-javascript:
    if: false
    name: CodeQL (JavaScript/TypeScript)
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        continue-on-error: true
