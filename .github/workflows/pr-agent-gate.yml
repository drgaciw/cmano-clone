name: PR agent gate

# Non-required pull_request check: DRG id, then duplicate Surface / hard-no paths.
# Does not checkout the pull request tree. Downloads only .github/scripts/pr_agent_gate.py
# from the workflow SHA. Uses the built-in read token on ubuntu-latest.
# Adding this check to required status checks is a later owner step.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-agent-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DRG-id
            command: drg-id
          - name: Duplicate Surface
            command: surface
    steps:
      - name: ${{ matrix.name }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_SCRIPT: .github/scripts/pr_agent_gate.py
          GATE_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          start_epoch=$(date +%s)
          write_runtime() {
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              end_epoch=$(date +%s)
              printf 'GATE_RUNTIME_SECONDS=%s\n' "$((end_epoch - start_epoch))" >> "${GITHUB_STEP_SUMMARY}"
            fi
          }
          trap write_runtime EXIT
          python3 - <<'PY'
          import base64
          import email.utils
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          script_path = os.environ["GATE_SCRIPT"]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          candidate_shas = [os.environ["GITHUB_SHA"]]
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path:
              with open(event_path, encoding="utf-8") as handle:
                  event = json.load(handle)
              pull = event.get("pull_request") if isinstance(event, dict) else None
              head = pull.get("head") if isinstance(pull, dict) else None
              head_sha = head.get("sha") if isinstance(head, dict) else None
              if isinstance(head_sha, str) and head_sha and head_sha not in candidate_shas:
                  candidate_shas.append(head_sha)

          max_wait = 60.0

          def wait_seconds(headers) -> float:
              now = time.time()
              delay = None
              retry_after = headers.get("Retry-After") if headers is not None else None
              reset = headers.get("X-RateLimit-Reset") if headers is not None else None
              if retry_after:
                  text = str(retry_after).strip()
                  try:
                      delay = float(text)
                  except ValueError:
                      parsed = email.utils.parsedate_to_datetime(text)
                      if parsed is not None:
                          if parsed.tzinfo is None:
                              parsed = parsed.replace(tzinfo=timezone.utc)
                          delay = parsed.timestamp() - now
              if delay is None and reset is not None:
                  try:
                      delay = float(str(reset).strip()) - now
                  except ValueError:
                      delay = None
              if delay is None:
                  delay = 1.0
              if delay < 0:
                  delay = 0.0
              if delay > max_wait:
                  delay = max_wait
              return delay

          def warn_and_skip(message: str) -> None:
              print(f"::warning title=PR agent gate::{message}")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write(message + "\n")
              skip = os.path.join(os.environ["RUNNER_TEMP"], "pr-agent-gate.skip")
              with open(skip, "w", encoding="utf-8") as handle:
                  handle.write(message)
              raise SystemExit(0)

          def is_limited(status: int, headers, body: str) -> bool:
              if status == 429:
                  return True
              remaining = headers.get("X-RateLimit-Remaining") if headers is not None else None
              if remaining == "0":
                  return True
              lowered = body.lower()
              return "rate limit" in lowered or "secondary rate" in lowered

          last_error = "contents API returned no body"
          loaded = False
          retried = False
          for sha in candidate_shas:
              while not loaded:
                  url = f"https://api.github.com/repos/{repo}/contents/{script_path}?ref={sha}"
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                          "User-Agent": "pr-agent-gate",
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as exc:
                      body = exc.read().decode("utf-8", "replace")
                      if is_limited(exc.code, exc.headers, body):
                          if not retried:
                              retried = True
                              time.sleep(wait_seconds(exc.headers))
                              continue
                          warn_and_skip(
                              "RATE_LIMIT_WARN GitHub API rate limit while loading the gate script; check skipped."
                          )
                      last_error = f"HTTP {exc.code} for {sha}"
                      if exc.code == 404:
                          break
                      print(f"::error::Unable to load {script_path}: {last_error}")
                      raise SystemExit(1) from exc
                  content = payload.get("content") if isinstance(payload, dict) else None
                  if not content:
                      last_error = f"no content for {sha}"
                      break
                  text = base64.b64decode(content).decode("utf-8")
                  destination = os.path.join(os.environ["RUNNER_TEMP"], "pr_agent_gate.py")
                  with open(destination, "w", encoding="utf-8") as handle:
                      handle.write(text)
                  print(f"Loaded {script_path} from {sha}")
                  loaded = True
              if loaded:
                  break
          if not loaded:
              print(f"::error::Unable to load {script_path}: {last_error}")
              raise SystemExit(1)
          PY
          if [[ -f "${RUNNER_TEMP}/pr-agent-gate.skip" ]]; then
            exit 0
          fi
          python3 "${RUNNER_TEMP}/pr_agent_gate.py" "${GATE_COMMAND}"
