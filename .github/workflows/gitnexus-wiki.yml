# See docs/engineering/buildkite-ci.md. Re-enable by restoring `on:` triggers and removing job `if`.
name: GitNexus Wiki Generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki:
    name: Generate Code Wiki
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install GitNexus
        run: npm install -g gitnexus
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: '1'

      - name: Index Repository
        run: gitnexus analyze
        env:
          GITNEXUS_WORKER_POOL_SIZE: '4'

      - name: Generate Wiki
        run: |
          gitnexus wiki \
            --model gpt-4o-mini \
            --timeout 120 \
            --retries 3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and push wiki on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "gitnexus-bot"
          git config user.email "gitnexus@users.noreply.github.com"
          git add wiki/ AGENTS.md CLAUDE.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No wiki changes to push"
            exit 0
          fi
          git commit -m "docs: auto-update code wiki [skip ci]"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GIT_PUSH_TOKEN}" push origin HEAD:refs/heads/main
