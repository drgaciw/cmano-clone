name: ReSharper regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resharper-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inspect:
    # Self-hosted only for push to main and schedule. Every pull_request and
    # every non-main push uses ubuntu-latest. Both of those runners are Linux,
    # so PATH and the jb/dotnet filenames below follow the runner OS.
    # The check name stays `inspect`.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The legacy roadmap alias cannot be materialized as a Windows symlink.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/reports/future-sprint-roadpmap.md
      - name: Use repo-scoped package caches
        shell: bash
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install pinned PowerShell and verify dotnet-install.ps1
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/install-pinned-pwsh.sh
          ps1="${RUNNER_TEMP}/dotnet-install.ps1"
          curl -fsSL https://dot.net/v1/dotnet-install.ps1 -o "$ps1"
          echo "e8b873e18a81e5c4cd8ab69d84dac8fead291d50b3c44633cd7fddad709a13d6  ${ps1}" | sha256sum -c -
      - name: Install isolated SDK and pinned ReSharper CLI
        shell: pwsh
        run: |
          $ps1 = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          if (-not (Test-Path -LiteralPath $ps1)) { throw 'Verified dotnet-install.ps1 is missing.' }
          & $ps1 -Version 11.0.100 -InstallDir (Join-Path $env:RUNNER_TEMP 'aegis-dotnet') -NoPath
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/aegis-dotnet"
          $env:PATH = "$env:DOTNET_ROOT$([IO.Path]::PathSeparator)$env:PATH"
          dotnet tool install JetBrains.ReSharper.GlobalTools --version 2026.3.0 --tool-path "$env:RUNNER_TEMP/resharper-cli"
          if ($LASTEXITCODE -ne 0) { throw 'ReSharper installation failed.' }
      - name: Verify comparison tests and inspect all frameworks
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = "$env:RUNNER_TEMP/aegis-dotnet"
          $env:PATH = "$env:DOTNET_ROOT$([IO.Path]::PathSeparator)$env:PATH"
          python -m unittest discover -s tools/resharper -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'SARIF comparison tests failed.' }
          $dotnet = Join-Path $env:DOTNET_ROOT 'dotnet'
          if (-not (Test-Path -LiteralPath $dotnet)) { $dotnet = Join-Path $env:DOTNET_ROOT 'dotnet.exe' }
          $jb = Join-Path $env:RUNNER_TEMP 'resharper-cli/jb'
          if (-not (Test-Path -LiteralPath $jb)) { $jb = Join-Path $env:RUNNER_TEMP 'resharper-cli/jb.exe' }
          ./tools/resharper/inspect.ps1 -DotnetPath $dotnet -ToolPath $jb -Check
      - name: Preserve inspection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resharper-inspection
          path: |
            artifacts/resharper/*.sarif
            artifacts/resharper/*.run.json
            artifacts/resharper/*.comparison.json
          if-no-files-found: warn
      - name: Clean workspace
        if: always()
        shell: bash
        run: bash tools/ci/selfhosted-cleanup.sh
