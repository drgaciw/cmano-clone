# DRG-766 — parallel port of .buildkite/pipeline.yml onto GitHub Actions.
# Buildkite keeps running. This file calls tools/buildkite/*.sh; it does not
# copy those scripts. There is no pull_request_target and no workflow_dispatch.
#
# Runner selection is an allow-list. A fork pull request can replace this
# file, so pull_request is never what selects the self-hosted labels.
# Self-hosted (self-hosted, linux, aegis) runs only for a push to main or a
# schedule event. Every pull_request, and any push that is not main, uses
# ubuntu-latest. fromJSON keeps the custom label list without an actionlint
# label config.
name: Self-hosted CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: selfhosted-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  # gitnexus-reindex.sh gates doc-only main pushes on these. Do not set
  # BUILDKITE_PULL_REQUEST: that script comments when gh is already authed.
  BUILDKITE_BRANCH: ${{ github.ref_name }}
  BUILDKITE_COMMIT: ${{ github.sha }}

jobs:
  selfhosted-build:
    name: Self-hosted build and test
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          # Matches BUILDKITE_GIT_CLONE_FLAGS: --depth=250
          fetch-depth: 250

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # pipeline.yml key "build": agent-dotnet-ci.sh, automatic retry limit 1.
      - name: Build and test
        run: |
          set -euo pipefail
          if ! bash tools/buildkite/agent-dotnet-ci.sh; then
            echo "Build and test failed; retrying once (Buildkite automatic retry limit 1)"
            bash tools/buildkite/agent-dotnet-ci.sh
          fi

      - name: Clean workspace
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh

  selfhosted-gitleaks:
    name: Self-hosted secret scan
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 250

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      # pipeline.yml key "gitleaks": soft_fail true.
      - name: Secret scan
        continue-on-error: true
        run: bash tools/buildkite/agent-gitleaks.sh

      - name: Clean workspace
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh

  selfhosted-baltic-replay:
    name: Self-hosted Baltic replay
    # pipeline.yml key "baltic-replay": branches main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 250

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Baltic replay golden
        run: bash tools/buildkite/agent-baltic-replay.sh

      - name: Clean workspace
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh

  selfhosted-gitnexus-pr:
    name: Self-hosted GitNexus PR analysis
    # pipeline.yml key "gitnexus-pr": pull requests only, soft_fail true.
    # pull_request always resolves to ubuntu-latest above.
    if: github.event_name == 'pull_request'
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 250

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: GitNexus PR analysis
        continue-on-error: true
        run: bash tools/buildkite/agent-gitnexus-pr-analysis.sh

      - name: Clean workspace
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh

  selfhosted-gitnexus-reindex:
    name: Self-hosted GitNexus reindex
    # pipeline.yml key "gitnexus-reindex": main only, blanket soft_fail.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
          fetch-depth: 250

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: GitNexus reindex
        continue-on-error: true
        run: bash tools/buildkite/agent-gitnexus-reindex.sh

      - name: Clean workspace
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh
