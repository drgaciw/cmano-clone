# Re-enabled 2026-11-20 under ADR-031 (Proposed), P1-4 / P1-5 (DRG-404).
# Hosted, non-required, best-effort. Runs the guarded reindex (DRG-323) with local embeddings.
# Output is a workflow artifact + post-check verdict; it does NOT update the box index
# (/workspace/gitnexus-index, name `cmano-clone`), which Build refreshes box-locally.
# Buildkite's gitnexus-reindex step is left unchanged until ADR-031 parity is met.
name: GitNexus Auto-Reindex

on:
  push:
    branches: [main]
    paths-ignore:            # parity with tools/buildkite/gitnexus-reindex.sh doc-only skip
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'production/dashboard-state.yaml'
  workflow_dispatch:         # kept for owner use; agents must not dispatch

permissions:
  contents: read

concurrency:
  group: gitnexus-reindex-main
  # Do not cancel an in-progress reindex. The job is read-only (contents: read,
  # GITNEXUS_SHARED_STORE=off, one artifact per SHA). cancel-in-progress killed
  # run 44744769182 at 11m40s and run 44747283887 mid-analyze. With false, the
  # running SHA finishes; GitHub still keeps only the latest pending run in
  # this group, so back-to-back merges queue instead of discarding that work.
  cancel-in-progress: false

jobs:
  reindex:
    name: Reindex Knowledge Graph
    if: github.repository == 'drgaciw/cmano-clone'   # never on forks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITNEXUS_VERSION: '1.6.12'          # match Buildkite / box
      GITNEXUS_SHARED_STORE: 'off'
      GITNEXUS_SKIP_OPTIONAL_GRAMMARS: '1'
      GITNEXUS_WORKER_POOL_SIZE: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'      # Node 20 is EOL; no npm cache (keeps the tree clean)

      - name: Cache embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: gitnexus-emb-${{ env.GITNEXUS_VERSION }}

      - name: Install GitNexus (pinned) + local embeddings runtime
        env:
          # runner.temp is not a legal context on job env (actionlint [expression]).
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/npm-global
        run: |
          set -euo pipefail
          mkdir -p "$NPM_CONFIG_PREFIX/bin"; echo "$NPM_CONFIG_PREFIX/bin" >> "$GITHUB_PATH"
          npm install -g "gitnexus@${GITNEXUS_VERSION}"
          "$NPM_CONFIG_PREFIX/bin/gitnexus" embeddings install
          "$NPM_CONFIG_PREFIX/bin/gitnexus" --version | tee "$RUNNER_TEMP/gitnexus-version.txt"

      - name: Guarded reindex (analyze --force --embeddings + post-check)
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/gitnexus-logs"
          /usr/bin/time -v bash tools/gitnexus-safe-reindex.sh 2>&1 | tee "$RUNNER_TEMP/gitnexus-logs/safe-reindex.log"
          echo "## GitNexus reindex" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'indexed=|garbage ids|gitnexus-safe-reindex:|Elapsed|Maximum resident' "$RUNNER_TEMP/gitnexus-logs/safe-reindex.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload index artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitnexus-index-${{ github.sha }}
          path: .gitnexus/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitnexus-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gitnexus-logs/
            ${{ runner.temp }}/gitnexus-version.txt
          if-no-files-found: warn
          retention-days: 14
