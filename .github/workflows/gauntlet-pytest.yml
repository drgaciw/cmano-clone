# DRG-59: run tools/qa-gauntlet pytest so catalog/coverage/diff guards are not local-only.
# Lightweight Python-only job — separate from gauntlet-oracle.yml (.NET Demo + oracle eval).
#
# Why: test_coverage_map_bootstrap_consistency (and 66 other guards) passed only when
# someone ran pytest locally; a red suite sat on main from #364 until #365 with no CI signal.
#
# Always runs on every PR (suite is ~15s). No path filter so this check can be required
# without hanging PRs that do not touch gauntlet paths.
name: gauntlet-pytest

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gauntlet-pytest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: tools/qa-gauntlet pytest
    # Self-hosted only for push to main and schedule. Every pull_request and
    # every non-main push uses ubuntu-latest.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule') && fromJSON('["self-hosted","linux","aegis"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use repo-scoped package caches
        run: bash tools/ci/selfhosted-cleanup.sh prepare-caches

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install deps
        run: pip install -r tools/qa-gauntlet/requirements.txt

      - name: Run pytest
        run: pytest tools/qa-gauntlet/ -q --tb=short

      - name: Test GitNexus reindex guard
        run: python3 -B -m unittest discover -s tools -p test_gitnexus_safe_reindex.py -v

      - name: Clean workspace and Docker
        if: always()
        run: bash tools/ci/selfhosted-cleanup.sh
