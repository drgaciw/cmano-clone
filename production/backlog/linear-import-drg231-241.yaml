    estimate: 3
    state: "Todo"
    labels:
      - "governance"
      - "hol"
      - "time-compression"
      - "conductor:csharp-sim-specialist"
    description: |
      ### Summary
      Connect `PendingApprovalQueue` order proposal insertions to `WatchAutoPauseGate` so that time-compressed simulation (60x–256x) automatically drops to 1x or pauses when a player decision is required, preventing silent 30-tick proposal expirations.

      ### Git Surface
      - `src/ProjectAegis.Sim/Time/WatchAutoPauseGate.cs`
      - `src/ProjectAegis.Delegation/Orchestration/PendingApprovalQueue.cs`
      - `src/ProjectAegis.Delegation.Tests/Orchestration/PendingApprovalQueueAutoPauseTests.cs`

      ### Acceptance Criteria
      - [ ] `WatchAutoPauseGate.ShouldAutoPause` evaluates true when `PendingApprovalQueue.HasPendingProposals` is true.
      - [ ] Unit tests verify that at 256x acceleration factor, enqueuing an order proposal immediately triggers the pause signal before tick elapses.
      - [ ] Existing ReplayGolden 6/6 continues to pass with 0 hash drift.

